<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RK Harvester Dashboard</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <section id="loginView" class="login-view">
    <div class="login-panel">
      <div class="brand-lockup">
        <span class="brand-icon">🚜</span>
        <div>
          <h1>RK Harvester</h1>
          <p>Work, collections, machines, staff, and expenses.</p>
        </div>
      </div>

      <label>
        Username
        <input id="username" value="owner" autocomplete="username">
      </label>
      <label>
        Password
        <input id="password" type="password" value="1234" autocomplete="current-password">
      </label>
      <button class="primary-btn" id="loginBtn">Login</button>
      <p class="hint">Default login: owner / 1234</p>
    </div>
  </section>

  <section id="appView" class="app-view is-hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">🚜</span>
        <div>
          <strong>RK Harvester</strong>
          <small>Operations manager</small>
        </div>
      </div>

      <nav class="menu" aria-label="Main menu">
        <button class="menu-item is-active" data-screen="dashboard"><span>▣</span>Dashboard</button>
        <button class="menu-item" data-screen="work"><span>▤</span>Work Entries</button>
        <button class="menu-item" data-screen="expenses"><span>₹</span>Expenses</button>
        <button class="menu-item" data-screen="machines"><span>⚙</span>Machines</button>
        <button class="menu-item" data-screen="staff"><span>◉</span>Staff</button>
        <button class="menu-item" data-screen="backup"><span>↧</span>Backup</button>
      </nav>

      <div class="sidebar-footer">
        <p id="sideSummary">Ready</p>
        <button class="secondary-btn" id="logoutBtn">Logout</button>
      </div>
    </aside>

    <button id="menuOverlay" class="menu-overlay is-hidden" aria-label="Close menu"></button>

    <div class="shell">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
        <div>
          <strong id="screenTitle">Dashboard</strong>
          <small id="screenSubtitle">Daily overview</small>
        </div>
        <div id="userBadge" class="user-badge"></div>
      </header>

      <main id="screen" class="screen"></main>
    </div>
  </section>

  <div id="modal" class="modal is-hidden">
    <div class="sheet">
      <button id="closeModal" class="icon-btn close-btn" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toast" class="toast is-hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="src/config.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
